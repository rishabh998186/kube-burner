---
global:
  gc: ${GC:=true}
  timeout: 4h

jobs:
  - name: test-templated-kind
    namespace: templated-kind-test
    jobIterations: 3
    qps: 5
    burst: 5
    namespacedIterations: false
    objects:
      - objectTemplate: objectTemplates/crd-templated.yml
        replicas: 1
        runOnce: true
      - objectTemplate: objectTemplates/cr-templated.yml
        replicas: 2
