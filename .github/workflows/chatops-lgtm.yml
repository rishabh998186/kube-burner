name: ChatOps LGTM
on:
  repository_dispatch:
    types: [lgtm-command]
permissions:
  issues: write
  pull-requests: write
  actions: write
jobs:
  lgtm:
    runs-on: ubuntu-latest
    steps:
      - name: Add LGTM Label + PR Review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get PR/issue number
            const issue_number = context.payload.client_payload.github.payload.issue.number;
            const repo = context.repo;
            
            console.log(`🔍 Target: ${repo.owner}/${repo.repo}#${issue_number}`);
            
            // 1. ADD lgtm label
            try {
              await github.rest.issues.addLabels({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: issue_number,
                labels: ['lgtm']
              });
              console.log('✅ lgtm label added!');
            } catch (error) {
              console.log(`❌ Label error: ${error.message}`);
              throw error;
            }
            
            // 2. Submit APPROVE review (Prow-style)
            try {
              await github.rest.pulls.createReview({
                owner: repo.owner,
                repo: repo.repo,
                pull_number: issue_number,
                event: 'APPROVE',
                body: '🤖 LGTM - Looks good to me!'
              });
              console.log('✅ PR review APPROVED!');
            } catch (error) {
              console.log(`⚠️ Review error (not PR?): ${error.message}`);
            }
            
            console.log('🎉 /lgtm COMPLETE!');
